# Build orchestration for FreeChess.
#
# Ordering matters in one place: the UI embeds the contract WASM at build time
# (a client PUTs the contract itself, not just its state), so contracts must be
# built first. Every task that builds the UI depends on `build-contracts`.

[config]
default_to_workspace = false
skip_core_tasks = true

[env]
# The node to talk to. Override for a second node:  WS_API_PORT=7510 cargo make publish
WS_API_PORT = { value = "7509", condition = { env_not_set = ["WS_API_PORT"] } }
WASM_DIR = "target/wasm32-unknown-unknown/release"
# The app's identity, committed rather than rebuilt. See published-contract/README.md.
PUBLISHED = "published-contract"
CONTRACTS = "game-contract lobby-contract archive-contract player-contract"

# ---------------------------------------------------------------- build

[tasks.build-contracts]
description = "Compile the contracts to WASM"
command = "cargo"
# `--locked` is load-bearing, not tidiness. A contract key is
# BLAKE3(BLAKE3(wasm) || params), so a lock that re-resolves on a release
# machine silently re-keys the contract. That is exactly how the app address
# moved on 2026-07-30.
args = [
    "build", "--locked", "--release", "--target", "wasm32-unknown-unknown",
    "-p", "game-contract",
    "-p", "lobby-contract",
    "-p", "archive-contract",
    "-p", "player-contract",
    "-p", "web-container-contract",
]

[tasks.build-delegate]
description = "Compile the delegate to WASM"
command = "cargo"
# `--locked` matters even more here: the delegate key derives from these bytes
# and the player's account seed is stored under it. A silent re-key loses every
# account. See `check-delegate-migration`.
args = ["build", "--locked", "--release", "--target", "wasm32-unknown-unknown", "-p", "chess-delegate"]

[tasks.webapp-params]
description = "Load the publisher key and write the contract parameters"
script_runner = "@shell"
script = '''
set -e
mkdir -p target/webapp

# The app's address is BLAKE3(BLAKE3(container wasm) || params), and params IS
# this key. So the key is what keeps the URL stable across releases — it is a
# long-lived artifact, not a per-build one. Publishing a new version does NOT
# need a new key: it rewrites the state at the same address, and the container
# contract only accepts a state whose `version` is higher, so an old build
# cannot overwrite a new one.
if [ ! -f .freenet-publisher.key ]; then
  echo "NOTE: no .freenet-publisher.key — creating one."
  echo "      This mints a NEW app address; every existing bookmark breaks."
  echo "      Restore the previous key instead if that is not what you want."
fi

cargo run --quiet -p webapp-packager -- \
  --key .freenet-publisher.key \
  --out-dir target/webapp \
  --params-only

# The committed params are the app's identity; the local key must be the one
# behind them. Catching a mismatch here turns "published to an address nobody
# has" into a build error before anything reaches the network.
if [ -f "${PUBLISHED}/webapp.params" ] \
   && ! cmp -s target/webapp/webapp.params "${PUBLISHED}/webapp.params"; then
  echo "ERROR: .freenet-publisher.key does not match ${PUBLISHED}/webapp.params." >&2
  echo "       This key would publish to a different address than the committed one." >&2
  echo "       Restore the right key, or migrate deliberately:" >&2
  echo "         cargo make update-published-contract" >&2
  exit 1
fi
'''

[tasks.build-ui]
description = "Build the web UI with the gateway base path baked in"
dependencies = ["build-contracts", "webapp-params"]
script_runner = "@shell"
script = '''
set -e
# The gateway serves the app under /v1/contract/web/<key>/, so every asset URL
# has to be prefixed with that path. The key depends only on the container WASM
# and the publisher key — NOT on the bundle contents — so it can be computed
# before the UI is built, which is what breaks the apparent circular dependency.
# dx writes each build under a content-hashed name and never removes the old
# ones, so the output directory accumulates every past bundle. Packaging that
# directory wholesale shipped ~9MB of stale WASM — which is what made the
# webapp too large to transfer reliably. Clear it first.
rm -rf target/dx/chess-ui

# From the COMMITTED container, not a fresh build: the base path baked into
# every asset URL has to be the address we will actually publish to.
KEY=$(fdev get-contract-id \
  --code "${PUBLISHED}/web_container_contract.wasm" \
  --parameters "${PUBLISHED}/webapp.params" | tr -d '[:space:]')

if [ -z "$KEY" ]; then
  echo "ERROR: could not derive the webapp contract id" >&2
  exit 1
fi
echo "webapp contract id: $KEY"

# Stamp the build so a running page can say which one it is. Without this a
# report of "it is doing X" cannot be tied to any particular deploy, which
# during a session of rapid republishes is most of the difficulty.
#
# `option_env!` on the UI side, so a plain `dx build` outside this task still
# compiles and simply reports an unknown build.
FREECHESS_BUILD="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
if ! git diff --quiet 2>/dev/null || ! git diff --cached --quiet 2>/dev/null; then
  FREECHESS_BUILD="${FREECHESS_BUILD}+dirty"
fi
export FREECHESS_BUILD
echo "build stamp: $FREECHESS_BUILD"

# Rewrite base_path in place, then restore it afterwards so `dx serve` (which
# serves from the root) keeps working during development.
cp ui/Dioxus.toml ui/Dioxus.toml.bak
sed -i "s|^#*base_path = .*|base_path = \"v1/contract/web/$KEY\"|" ui/Dioxus.toml
( cd ui && dx build --release --platform web )
status=$?
mv ui/Dioxus.toml.bak ui/Dioxus.toml
exit $status
'''

[tasks.build]
description = "Build everything"
dependencies = ["build-contracts", "build-delegate", "build-ui"]

# ---------------------------------------------------------------- checks

[tasks.test]
description = "Run the test suite"
command = "cargo"
args = ["test", "--workspace", "--exclude", "chess-ui"]

[tasks.test-deep]
description = "Run the slow perft checks"
command = "cargo"
args = ["test", "-p", "chess-core", "--release", "--", "--ignored"]

[tasks.fmt]
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy]
command = "cargo"
args = ["clippy", "--workspace", "--exclude", "chess-ui", "--", "-D", "warnings"]

[tasks.preflight]
description = "Everything CI would run, before publishing"
dependencies = [
    "fmt",
    "clippy",
    "test",
    "check-contract-keys",
    "check-published-contract",
    "check-delegate-migration",
]

[tasks.check-contract-keys]
description = "Fail if two contracts hash to the same WASM"
dependencies = ["build-contracts"]
script_runner = "@shell"
script = '''
cd "${WASM_DIR}"
duplicates=$(sha256sum game_contract.wasm lobby_contract.wasm archive_contract.wasm player_contract.wasm \
  | awk '{print $1}' | sort | uniq -d)
if [ -n "$duplicates" ]; then
  echo "ERROR: two or more contracts compiled to identical WASM."
  echo "Their contract keys would collide. This usually means the"
  echo "'freenet-main-contract' feature is missing, so no entry points were"
  echo "emitted and the contract logic was dead-code eliminated."
  sha256sum game_contract.wasm lobby_contract.wasm archive_contract.wasm player_contract.wasm
  exit 1
fi
echo "contract WASMs are distinct:"
sha256sum game_contract.wasm lobby_contract.wasm archive_contract.wasm player_contract.wasm
'''

[tasks.check-delegate-migration]
description = "Fail if the delegate was re-keyed without recording a migration"
dependencies = ["build-delegate"]
script_runner = "@shell"
script = '''
# The player's account seed lives in the delegate's secret store, filed under
# BLAKE3(BLAKE3(wasm)). Change the WASM and every account becomes unreachable —
# and unlike a moved contract address, republishing cannot undo it.
#
# So this compares the built delegate against the hash recorded in
# CURRENT_DELEGATE_CODE_HASH and fails when they part company. The point is to
# make an accidental re-key impossible to ship quietly; a deliberate one just
# means recording the outgoing hash first.
BUILT=$(cargo run --quiet -p delegate-key -- "${WASM_DIR}/chess_delegate.wasm" \
  | awk '/code_hash_hex/ {print $2}')
RECORDED=$(grep -A3 'pub const CURRENT_DELEGATE_CODE_HASH' common/src/delegate_api.rs \
  | grep -oE '0x[0-9a-f]{2}' | sed 's/0x//' | tr -d '\n')

if [ "$BUILT" = "$RECORDED" ]; then
  echo "delegate key unchanged ($BUILT)"
  exit 0
fi

echo "ERROR: the delegate WASM changed, so its key changed with it." >&2
echo "  built:    $BUILT" >&2
echo "  recorded: $RECORDED" >&2
echo >&2
echo "Every player's account seed is stored under the OLD key. Before shipping:" >&2
echo "  1. Add the recorded hash above to LEGACY_DELEGATE_CODE_HASHES in" >&2
echo "     common/src/delegate_api.rs, so clients know where to look." >&2
echo "  2. Set CURRENT_DELEGATE_CODE_HASH to the built hash." >&2
echo "  3. Commit both in the same change." >&2
exit 1
'''

[tasks.check-no-wasm-bindgen]
description = "Fail if a contract or the delegate imports wasm-bindgen"
dependencies = ["build-contracts", "build-delegate"]
script_runner = "@shell"
script = '''
# wasm-bindgen imports cannot be resolved by wasmtime and make a contract fail
# at instantiation, usually with an opaque error. Catch it at build time.
failed=0
for f in ${WASM_DIR}/*_contract.wasm ${WASM_DIR}/chess_delegate.wasm; do
  if strings "$f" | grep -q "__wbindgen"; then
    echo "ERROR: $f imports wasm-bindgen"
    failed=1
  fi
done
if [ "$failed" = "1" ]; then
  echo "A dependency pulled wasm-bindgen into the contract graph."
  echo "Find it with: cargo tree -p <crate> --target wasm32-unknown-unknown -i wasm-bindgen"
  exit 1
fi
echo "no wasm-bindgen imports in contracts or delegate"
'''

# ---------------------------------------------------------------- publish

[tasks.package-webapp]
description = "Package, sign and assemble the UI into web-container state"
dependencies = ["build-ui"]
script_runner = "@shell"
script = '''
set -e
OUT="target/webapp"
# dx 0.7 emits the bundle here; older layouts used ui/dist. Probe both so the
# task keeps working across CLI versions rather than silently packaging nothing.
DIST=""
for candidate in \
  "target/dx/chess-ui/release/web/public" \
  "ui/dist/public" \
  "ui/dist"; do
  if [ -d "$candidate" ] && [ -f "$candidate/index.html" ]; then DIST="$candidate"; break; fi
done
if [ -z "$DIST" ]; then
  echo "ERROR: no built webapp found — run 'cargo make build-ui' first" >&2
  exit 1
fi
echo "packaging from $DIST"
mkdir -p "$OUT"

# GNU tar flags for a byte-reproducible archive: identical inputs must give an
# identical archive, or the webapp state (and its signature) churn on every
# build for no reason.
tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
    -C "$DIST" -cf "$OUT/webapp.tar" .
xz -f -9 "$OUT/webapp.tar"

# Bump the version so a republish is always accepted: the contract rejects a
# version that is not greater than the one it holds.
#
# The counter is COMMITTED. It used to live under target/, which is gitignored,
# so a `cargo clean` reset it to 1 and every publish afterwards was rejected by a
# network already holding 55 — with nothing to tell you why. It is also a
# counter and never a timestamp: River lost a day to a clock-derived version
# that ended up permanently behind the on-network one.
#
# Bumping before publishing risks leaving the file ahead if the publish fails,
# so snapshot first; publish-webapp restores the snapshot on failure.
VERSION_FILE="${PUBLISHED}/contract-version.txt"
if [ ! -f "$VERSION_FILE" ]; then
  echo "ERROR: $VERSION_FILE is missing." >&2
  echo "       Seed it with the version currently live on the network." >&2
  exit 1
fi
CURRENT=$(tr -d '[:space:]' < "$VERSION_FILE")
VERSION=$(( CURRENT + 1 ))
cp "$VERSION_FILE" "$VERSION_FILE.prev"
echo "$VERSION" > "$VERSION_FILE"
echo "web-container version: $CURRENT -> $VERSION (commit $VERSION_FILE after a successful publish)"

cargo run --quiet -p webapp-packager -- \
  --archive "$OUT/webapp.tar.xz" \
  --key .freenet-publisher.key \
  --version "$VERSION" \
  --out-dir "$OUT"
'''

[tasks.publish-delegate]
description = "Pre-register the delegate on the local node (optional)"
dependencies = ["build-delegate"]
script_runner = "@shell"
script = '''
# Belt and braces only. The app embeds the delegate WASM and registers it over
# the websocket on every load (`register_delegate_request` in ui/src/freenet.rs),
# because a delegate has to exist on whichever node the *browser* is talking to
# — which is not necessarily the one this task publishes to.
#
# So a failure here is not fatal and must not abort a release. It currently
# fails outright when fdev is newer than the node ("unsupported incremental API
# version"), which took down the whole publish for a step that changes nothing.
if fdev --port "${WS_API_PORT}" publish \
  --code "${WASM_DIR}/chess_delegate.wasm" \
  delegate 2>&1; then
  echo "delegate pre-registered on port ${WS_API_PORT}"
else
  echo "NOTE: could not pre-register the delegate on port ${WS_API_PORT}."
  echo "      Harmless — the app registers it itself on load. Usually means"
  echo "      fdev ($(fdev --version 2>/dev/null | tail -1)) is newer than the node."
fi
'''

[tasks.publish-webapp]
description = "Publish the UI at its stable address, and verify it really landed"
dependencies = ["package-webapp"]
script_runner = "@shell"
script = '''
OUT="target/webapp"
VERSION_FILE="${PUBLISHED}/contract-version.txt"

# Roll the version counter back if anything below fails, so a failed attempt
# cannot leave us numbered ahead of what the network actually holds.
rollback_version() {
  if [ -f "$VERSION_FILE.prev" ]; then
    mv "$VERSION_FILE.prev" "$VERSION_FILE"
    echo "rolled $VERSION_FILE back to $(cat "$VERSION_FILE")" >&2
  fi
}
trap 'rollback_version' EXIT
set -e

# Everything comes from the COMMITTED artifact — never a fresh build. That is
# the whole point: rebuilding is what moves the address. See
# published-contract/README.md.
KEY=$(fdev get-contract-id \
  --code "${PUBLISHED}/web_container_contract.wasm" \
  --parameters "${PUBLISHED}/webapp.params" 2>/dev/null | tr -d '[:space:]')
PINNED=$(tr -d '[:space:]' < "${PUBLISHED}/contract-id.txt")

# The gate. If these ever disagree, the committed files are inconsistent and
# publishing would land somewhere nobody has bookmarked.
if [ "$KEY" != "$PINNED" ]; then
  echo "ERROR: the committed container does not derive the committed address." >&2
  echo "  derived: $KEY" >&2
  echo "  pinned:  $PINNED" >&2
  echo "  Someone edited published-contract/ by hand. To change the address on" >&2
  echo "  purpose, use: cargo make update-published-contract" >&2
  exit 1
fi

# PUT, at the same address every time. `fdev execute update` is NOT the route:
# it fails with "missing contract" even right after a successful GET, because
# only a PUT registers the contract's code with the node.
fdev --port "${WS_API_PORT}" publish \
  --code "${PUBLISHED}/web_container_contract.wasm" \
  --parameters "${PUBLISHED}/webapp.params" \
  contract \
  --state "$OUT/webapp.state"

# The PUT itself succeeded. From here on, DO NOT roll the counter back.
#
# Rolling back on a failed *verification* is what makes the counter lie: the
# state is already on the network at the bumped version, so restoring the file
# leaves us numbered behind, and the next publish is rejected for being no
# higher than what is already there. That is the exact incident the committed
# counter exists to prevent, reintroduced from the other end. The rollback
# belongs to a failed publish, and nothing else.
rm -f "$VERSION_FILE.prev"
trap - EXIT

# Verify rather than trust the output. `fdev publish` prints "published
# successfully" in cases where nothing was stored at all, and it has also
# reported success while the node kept serving a previous build — both of which
# cost hours to notice. Compare what is served against what was just built.
DIST=""
for candidate in "target/dx/chess-ui/release/web/public" "ui/dist/public" "ui/dist"; do
  if [ -f "$candidate/index.html" ]; then DIST="$candidate"; break; fi
done
BUILT=$(grep -oE 'assets/chess-ui-[a-z0-9]+\.js' "$DIST/index.html" | head -1)

# Poll rather than glance. A single look five seconds in reported a false
# failure on a node that was serving the new build moments later — and the
# false alarm was worse than no check, because it triggered a rollback.
SERVED=""
for _ in $(seq 12); do
  sleep 5
  SERVED=$(curl -s --max-time 90 \
    "http://127.0.0.1:${WS_API_PORT}/v1/contract/web/${KEY}/?__sandbox=1" \
    | grep -oE 'assets/chess-ui-[a-z0-9]+\.js' | head -1)
  [ "$BUILT" = "$SERVED" ] && break
done

echo
if [ "$BUILT" = "$SERVED" ]; then
  echo "FreeChess is live at:"
  echo "  http://127.0.0.1:${WS_API_PORT}/v1/contract/web/${KEY}/"
  echo
  echo "Commit ${VERSION_FILE} (now $(cat "$VERSION_FILE"))."
else
  echo "WARNING: the node is not serving the build that was just published."
  echo "  built:  ${BUILT:-<none>}"
  echo "  served: ${SERVED:-<none>}"
  echo "  The publish reported success regardless — retry, and check with:"
  echo "    fdev --port ${WS_API_PORT} execute get ${KEY}"
  echo
  echo "  The version counter was NOT rolled back: the state may well be on the"
  echo "  network at $(cat "$VERSION_FILE") even though this node is not serving it"
  echo "  yet, and numbering ourselves back would make every later publish fail."
  exit 1
fi
'''

[tasks.update-published-contract]
description = "Deliberately re-key the app: rebuild the container and move its address"
dependencies = ["build-contracts"]
script_runner = "@shell"
script = '''
set -e
OLD_ID=$(tr -d '[:space:]' < "${PUBLISHED}/contract-id.txt" 2>/dev/null || echo "<none>")

cargo run --quiet -p webapp-packager -- \
  --key .freenet-publisher.key --out-dir target/webapp --params-only

NEW_ID=$(fdev get-contract-id \
  --code "${WASM_DIR}/web_container_contract.wasm" \
  --parameters target/webapp/webapp.params | tr -d '[:space:]')

if [ "$NEW_ID" = "$OLD_ID" ]; then
  echo "The rebuilt container derives the same address ($NEW_ID). Nothing to do."
  exit 0
fi

cp "${WASM_DIR}/web_container_contract.wasm" "${PUBLISHED}/"
cp target/webapp/webapp.params "${PUBLISHED}/webapp.params"
echo "$NEW_ID" > "${PUBLISHED}/contract-id.txt"

echo
echo "The app address has MOVED."
echo "  old: $OLD_ID"
echo "  new: $NEW_ID"
echo
echo "Every existing bookmark now points at the old address. Before shipping this:"
echo "  1. Publish a migration notice AT THE OLD ADDRESS from the admin panel."
echo "     It locks new games in the lobby, leaves games in progress running,"
echo "     and shows players where to go. The old bytes are still in git history,"
echo "     so the old address remains publishable — that is why we freeze them."
echo "  2. Commit ${PUBLISHED}/ in one commit, recording the old address in the"
echo "     message so it can be recovered from history."
'''

[tasks.check-published-contract]
description = "Report whether a rebuilt container would still match the committed one"
dependencies = ["build-contracts"]
script_runner = "@shell"
script = '''
# Informational, never fatal. Drift here is expected and harmless — it just
# means a dependency moved since the container was frozen, and we keep
# publishing the frozen bytes anyway. It becomes interesting only when someone
# edits the container's source and wonders why nothing changed.
FROZEN=$(sha256sum "${PUBLISHED}/web_container_contract.wasm" | cut -d' ' -f1)
FRESH=$(sha256sum "${WASM_DIR}/web_container_contract.wasm" | cut -d' ' -f1)
echo "container (committed): $FROZEN"
echo "container (rebuilt):   $FRESH"
if [ "$FROZEN" = "$FRESH" ]; then
  echo "-> identical; a rebuild would keep the address."
else
  echo "-> DRIFTED. Publishing still uses the committed bytes, so the address is safe."
  echo "   If you changed the container's source and expect it to take effect,"
  echo "   you must re-key deliberately: cargo make update-published-contract"
fi
'''

[tasks.publish]
description = "Build and publish everything to the local node"
dependencies = [
    "build",
    "check-contract-keys",
    "check-no-wasm-bindgen",
    "publish-delegate",
    "publish-webapp",
]

# ---------------------------------------------------------------- dev

[tasks.dev]
description = "Serve the UI with hot reload against the local node"
dependencies = ["build-contracts"]
cwd = "ui"
command = "dx"
args = ["serve", "--platform", "web"]

[tasks.nodes-up]
description = "Start the isolated two-node test network"
script_runner = "@shell"
script = "./scripts/nodes.sh up"

[tasks.nodes-down]
script_runner = "@shell"
script = "./scripts/nodes.sh down"

[tasks.test-e2e]
description = "Three-node browser test, from a wiped network"
dependencies = ["build"]
script_runner = "@shell"
script = '''
set -e
# Wipe, don't just restart. The suite is NOT idempotent against a used network,
# and the two ways it fails both look like app bugs:
#
#  * The account persists in the delegate, so a node is the SAME player on every
#    run. Past MAX_OPEN_PER_CREATOR (3) unfinished games, the anti-spam quota
#    stops listing that player's new ones — and a test waiting for its game to
#    appear in the lobby hangs.
#  * Adminship is first-come and permanent, so the second run onwards has no
#    claim to make.
#
# Both are the rules working correctly. Starting clean is what makes a red run
# mean something.
./scripts/nodes.sh wipe
./scripts/nodes.sh up

# Publish to all three: a node only serves the app it holds itself.
for port in 7511 7512 7514; do
  WS_API_PORT=$port cargo make --quiet publish-delegate
  WS_API_PORT=$port cargo make --quiet publish-webapp
done

cd e2e && npx playwright test
'''

[tasks.clean]
command = "cargo"
args = ["clean"]
